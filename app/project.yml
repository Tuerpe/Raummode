# XcodeGen-Projektdefinition. Auf dem macOS-Runner: `xcodegen generate` -> Raummode.xcodeproj
name: Raummode
options:
  bundleIdPrefix: de.levin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  RaummodeDSP:
    path: RaummodeDSP

targets:
  Raummode:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: RaummodeDSP
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Raummode
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSMicrophoneUsageDescription: "Raummode misst mit dem Mikrofon den Frequenzgang deiner Lautsprecher."
        NSLocalNetworkUsageDescription: "Optional: Messdateien per WLAN an den PC uebertragen."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.levin.raummode
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
